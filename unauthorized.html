<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not authorized — Coordinated Learning Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="main.css" />
  <style>
    body { background: var(--bg-alt); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .center-card {
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.25rem 2rem 2rem;
      width: 100%;
      max-width: 480px;
      border-top: 5px solid var(--usf-gold);
      text-align: center;
    }
    .center-card h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--usf-green);
      margin: 0 0 .5rem;
    }
    .center-card p { color: var(--ink-muted); margin: 0 0 1.5rem; }
    .actions {
      display: flex;
      gap: .75rem;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="center-card">
    <h1>You don't have access to that page.</h1>
    <p>Your account doesn't have permission for this area. If that seems wrong, sign in as a different account.</p>
    <div class="actions">
      <a href="resource-mapping.html" class="btn btn--ghost">Back</a>
      <button type="button" class="btn btn--primary" id="signout-btn">Sign out</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('signout-btn').addEventListener('click', () => window.Auth.signOut());
  </script>

</body>
</html>
